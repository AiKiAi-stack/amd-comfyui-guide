name: Check tutorial snapshot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_workflow_checks.py
      - run: python scripts/test_conditioned_graph.py
      - run: python scripts/test_replay_partial.py
      - run: python -m unittest discover -s scripts -p test_report_evidence.py
      - run: python -m unittest discover -s scripts -p test_report_presentation.py
      - run: python scripts/verify_publication.py
