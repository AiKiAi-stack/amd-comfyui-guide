<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; background:#050505; overflow:hidden; }
  body { padding:100px 96px 0 96px; display:flex; flex-direction:column; }
  .title { font:700 86px 'DejaVu Sans', sans-serif; color:#F2EFE8; letter-spacing:-2.5px; line-height:1.05; }
  .sub { font:400 30px 'DejaVu Sans', sans-serif; color:#9B968B; margin-top:18px; line-height:1.35; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:30px; margin-top:72px; }
  .card img { width:100%; height:580px; object-fit:cover; display:block; }
  .card .lab { font:600 27px 'DejaVu Sans', sans-serif; color:#EDE9E1; margin-top:24px; letter-spacing:.2px; }
  .card .desc { font:400 22px 'DejaVu Sans', sans-serif; color:#8D887E; margin-top:8px; }
</style>
</head>
<body>
  <div class="title">Real outputs. Real measurements.</div>
  <div class="sub">Every feature ships with its prompt, workflow, output image, timing and record.</div>

  <div class="grid">
    <div class="card">
      <img src="../../assets/src/qwen21-turbo-cat.png" alt="Qwen Image 2.1 Turbo output">
      <div class="lab">Qwen Image 2.1 &middot; Turbo</div>
      <div class="desc">Text to image</div>
    </div>
    <div class="card">
      <img src="../../assets/src/flux2-klein-watercolor-cat.png" alt="FLUX.2 Klein output">
      <div class="lab">FLUX.2 Klein</div>
      <div class="desc">Style edit</div>
    </div>
    <div class="card">
      <img src="../../assets/src/kroma-q2-forest-fox.png" alt="Kroma Q2 output">
      <div class="lab">Kroma Q2</div>
      <div class="desc">4-step sampling</div>
    </div>
    <div class="card">
      <img src="../../assets/src/moss-sft-astronaut.png" alt="MOSS SFT output">
      <div class="lab">MOSS SFT</div>
      <div class="desc">8-step LoRA</div>
    </div>
  </div>
</body>
</html>
