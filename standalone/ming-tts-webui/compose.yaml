name: ming-tts
services:
  webui:
    build:
      context: .
      network: host
      entitlements:
        - network.host
      args:
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
        NO_PROXY: localhost,127.0.0.1
    image: ming-tts-webui:local
    ports:
      - "127.0.0.1:7861:7861"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID}"
    volumes:
      - type: bind
        source: ${MODEL_DIR}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_DIR}
        target: /data
        bind:
          create_host_path: false
    environment:
      MING_HOST: 0.0.0.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 1gb
    mem_limit: 8g
    cpus: 8
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7861/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
